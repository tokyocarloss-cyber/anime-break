name: Build Anime Break APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'web/**'
      - 'source_chunks/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare game assets
        shell: bash
        run: |
          mkdir -p web
          cat source_chunks/game.b64.* | base64 -d > web/game.js
          cat source_chunks/style.b64.* | base64 -d > web/style.css
          curl -L --fail --retry 3 https://raw.githubusercontent.com/mrdoob/three.js/r160/build/three.min.js -o web/three.min.js
          test -s web/three.min.js

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android 35 SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-break-art-slice-0.4-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
