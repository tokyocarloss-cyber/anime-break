<style>

#versus{background:linear-gradient(145deg,#101931 0 47%,#361512 47% 53%,#17111f 53% 100%);align-items:center;justify-content:center;overflow:hidden}.versusCard{width:min(1000px,92vw);height:min(620px,86vh);display:grid;grid-template-columns:1fr 160px 1fr;align-items:center;position:relative}.portrait{height:78%;position:relative;display:flex;align-items:center;justify-content:center}.portrait .silhouette{width:72%;height:90%;filter:drop-shadow(0 24px 18px rgba(0,0,0,.35));position:relative}.portrait.left .silhouette{transform:scale(1.04) rotate(-2deg)}.portrait.right .silhouette{transform:scale(1.04) rotate(2deg)}.faceDisc{position:absolute;width:180px;height:180px;border-radius:50%;top:14%;background:radial-gradient(circle at 45% 40%,#ffd6ae 0 42%,#b46a4c 43% 58%,transparent 60%);border:8px solid rgba(255,255,255,.08);box-shadow:0 0 0 2px rgba(255,255,255,.08)}.hair{position:absolute;top:4%;left:19%;width:62%;height:34%;background:var(--hair);clip-path:polygon(0 62%,12% 25%,24% 42%,36% 2%,46% 36%,62% 0,67% 40%,84% 15%,79% 53%,100% 38%,83% 78%,24% 86%);filter:drop-shadow(0 7px 0 rgba(0,0,0,.22))}.bodyShape{position:absolute;left:18%;right:18%;top:40%;bottom:5%;background:linear-gradient(100deg,var(--body1),var(--body2));clip-path:polygon(22% 0,78% 0,100% 22%,91% 97%,9% 97%,0 22%);border-radius:16px}.beltShape{position:absolute;left:18%;right:18%;top:65%;height:9%;background:var(--accent);transform:skewY(-3deg)}.portraitName{position:absolute;bottom:2%;font-size:clamp(28px,5vw,70px);font-weight:1000;letter-spacing:-.05em;font-style:italic;text-transform:uppercase;text-shadow:0 6px 0 rgba(0,0,0,.26)}.portrait.left .portraitName{left:2%}.portrait.right .portraitName{right:2%}.tag{position:absolute;bottom:-22px;color:#c9d3df;font-size:11px;letter-spacing:.18em;text-transform:uppercase}.portrait.left .tag{left:3%}.portrait.right .tag{right:3%;text-align:right}.vsMark{font-size:78px;font-weight:1000;font-style:italic;letter-spacing:-.12em;text-shadow:0 8px 0 rgba(0,0,0,.3 #hud{position:fixed;inset:0;z-index:12;pointer-events:none}.hudTop{position:absolute;top:max(10px,env(safe-area-inset-top));left:3vw;right:3vw;height:86px;display:grid;grid-template-columns:1fr 110px 1fr;gap:16px;align-items:start}.fighterHud{position:relative}.fighterHud.right{text-align:right}.nameRow{display:flex;justify-content:space-between;align-items:end;font-weight:950;font-style:italic;letter-spacing:.05em;font-size:15px;margin-bottom:5px;text-shadow:0 2px 4px #000}.fighterHud.right .nameRow{flex-direction:row-reverse}.hp{height:18px;background:rgba(2,5,12,.76);border:2px solid rgba(255,255,255,.45);transform:skewX(-14deg);overflow:hidden;box-shadow:0 7px 13px rgba(0,0,0,.25)}.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#53e78f,#f4dc64 74%,#ff5f5f);transition:width .15s}.fighterHud.right .hp i{margin-left:auto;background:linear-gradient(270deg,#58d9ff,#84f1ff 72%,#fff0a5)}.energy{height:7px;margin-top:5px;background:rgba(3,7,16,.8);overflow:hidden;transform:skewX(-14deg)}.energy i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff7b3d,#ffd85b)}.fighterHud.right .energy i{margin-left:auto;background:linear-gradient(270deg,#5ddcff,#7d88ff)}.timer{height:53px;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:27px;background:rgba(8,11,21,.76);border:1px solid rgba(255,255,255,.22);clip-path:polygon(16% 0,84% 0,100% 30%,85% 100%,15% 100%,0 30%);text-shadow:0 4px 0 rgba(0,0,0,.25)}.ultBadge{font-size:9px;letter-spacing:.12em;color:#ffe9a6;margin-top:5px;opacity:.85}.lockReticle{position:absolute;left:50%;top:50%;width:68px;height:68px;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.7);border-radius:50%;box-shadow:0 0 0 8px rgba(255,255,255,.04);opacity:0;transition:opacity .15s}.lockReticle.on{opacity:1}.lockReticle:before,.lockReticle:after{content:"";position:absolute;background:#fff}.lockReticle:before{width:22px;height:2px;left:21px;top:31px}.lockReticle:after{width:2px;height:22px;left:31px;top:21px}.battleText{position:absolute;left:50%;top:21%;transform:translateX(-50%) rotate(-2deg);font-size:clamp(20px,4vw,48px);font-weight:1000;font-style:italic;text-shadow:0 6px 0 rgba(0,0,0,.4);opacity:0}.battleText.show{animation:popText .75s ease}@keyframes popText{0%{opacity:0;transform:translateX(-50%) scale(.6) rotate(-5deg)}20%{opacity:1;transform:translateX(-50%) scale(1.08) rotate(-2deg)}75%{opacity:1}100%{opacity:0}}
#touchUI{position:fixed;inset:0;z-index:16;pointer-events:none}.joystick{pointer-events:auto;position:absolute;left:max(22px,4vw);bottom:max(24px,env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08) 0 34%,rgba(255,255,255,.03) 35% 56%,rgba(255,255,255,.14) 57% 59%,rgba(2,5,12,.18) 60%);backdrop-filter:blur(3px)}.joyKnob{position:absolute;width:58px;height:58px;left:46px;top:46px;border-radius:50%;background:linear-gradient(#f5f7ff,#a8b2c8);box-shadow:0 7px 22px rgba(0,0,0,.35),inset 0 0 0 8px rgba(255,255,255,.24)}.buttons{pointer-events:auto;position:absolute;right:max(18px,3vw);bottom:max(20px,env(safe-area-inset-bottom));width:min(390px,48vw);height:230px}.act{position:absolute;border:1px solid rgba(255,255,255,.28);border-radius:50%;color:#fff;background:linear-gradient(145deg,rgba(25,34,58,.9),rgba(7,11,23,.92));box-shadow:0 10px 22px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.16);font-weight:1000;pointer-events:auto}.act small{display:block;font-size:8px;letter-spacing:.08em;margin-top:2px}.act:active{transform:scale(.92);filter:brightness(1.3)}#atk{right:20px;bottom:54px;width:88px;height:88px;background:linear-gradient(145deg,#ff7a3e,#b52f22);font-size:25px}#skill{right:105px;bottom:128px;width:72px;height:72px;background:linear-gradient(145deg,#6978ff,#263682);font-size:20px}#dash{right:112px;bottom:22px;width:69px;height:69px;background:linear-gradient(145deg,#37d0ff,#15556f);font-size:21px}#guard{right:196px;bottom:105px;width:62px;height:62px;font-size:17px}#ult{right:202px;bottom:26px;width:76px;height:76px;background:linear-gradient(145deg,#ffd65c,#ad6017);color:#1d1407;font-size:18px}#lock{right:280px;bottom:105px;width:58px;height:58px;font-size:16px}.pause{position:absolute;right:16px;top:96px;pointer-events:auto;width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(6,9,18,.58);color:#fff;font-weight:900}
#cutin{position:fixed;inset:0;z-index:30;display:none;pointer-events:none;background:linear-gradient(120deg,transparent 0 14%,rgba(0,0,0,.86) 15% 78%,transparent 79%);animation:cut .72s ease both}#cutin.show{display:block}.cutInner{position:absolute;left:12%;right:12%;top:29%;height:34%;overflow:hidden;transform:skewX(-12deg);border-top:3px solid #fff;border-bottom:3px solid #fff;background:linear-gradient(90deg,#f77d38,#8d201d)}.cutFace{position:absolute;left:9%;top:-30%;width:30%;height:170%;border-radius:48%;background:radial-gradient(circle at 46% 48%,#ffd0a8 0 36%,#9f523f 37% 49%,transparent 50%);box-shadow:0 0 0 100px rgba(0,0,0,.08)}.cutEye{position:absolute;left:18%;top:42%;width:76%;height:9%;background:#fff;clip-path:polygon(0 45%,42% 0,100% 42%,42% 100%)}.cutEye:after{content:"";position:absolute;left:52%;top:-20%;width:9%;height:140%;background:#111;border-radius:50%}.cutQuote{position:absolute;right:8%;top:26%;font-weight:1000;font-size:clamp(27px,5vw,64px);font-style:italic;text-shadow:0 6px 0 rgba(0,0,0,.28)}.cutQuote small{display:block;font-size:16px;letter-spacing:.18em;margin-top:8px}.mangaLines{position:absolute;inset:0;background:repeating-linear-gradient(94deg,transparent 0 11px,rgba(255,255,255,.12) 12px 13px);mix-blend-mode:screen}@keyframes cut{0%{opacity:0;transform:translateX(-10%) scale(1.08)}18%{opacity:1;transform:translateX(0) scale(1)}78%{opacity:1}100%{opacity:0;transform:translateX(6%)}}
.modal{position:fixed;inset:0;z-index:40;background:rgba(2,4,10,.72);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center}.card{width:min(520px,86vw);padding:34px;background:linear-gradient(150deg,rgba(21,28,50,.97),rgba(8,11,22,.98));border:1px solid rgba(255,255,255,.18);box-shadow:0 25px 70px rgba(0,0,0,.45);clip-path:polygon(0 0,94% 0,100% 12%,100% 100%,6% 100%,0 88%)}.card h2{margin:0 0 10px;font-size:34px;font-style:italic}.card p{color:#b9c4d5;line-height:1.55}.card .menuBtn{width:100%;margin-top:10px;text-align:center}.ko{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;pointer-events:none}.koWord{font-size:clamp(100px,28vw,330px);font-weight:1000;font-style:italic;letter-spacing:-.12em;color:#fff;text-shadow:8px 10px 0 #be2d26,14px 17px 0 rgba(0,0,0,.28);animation:ko .95s ease both}@keyframes ko{0%{transform:scale(2.4) rotate(-7deg);opacity:0}18%{transform:scale(.88) rotate(-7deg);opacity:1}30%{transform:scale(1.04) rotate(-7deg)}80%{opacity:1}100%{opacity:0;transform:scale(1.08) rotate(-7deg)}}
@media (max-width:700px){.brand{top:8vh}.brand .slash{font-size:56px}.menuActions{width:54vw;right:5vw;bottom:10vh}.versusCard{grid-template-columns:1fr 80px 1fr}.vsMark{font-size:48px}.hudTop{grid-template-columns:1fr 74px 1fr;gap:7px}.timer{font-size:20px}.nameRow{font-size:11px}.joystick{width:132px;height:132px}.joyKnob{left:39px;top:39px;width:54px;height:54px}.buttons{width:48vw;transform:scale(.88);transform-origin:right bottom}}
</style>
</head>
<body>
<canvas id="game"></canvas><div id="grain"></div><div id="vignette"></div><div id="flash"></div>
<section id="menu" class="screen menu active"><div class="brand"><div class="slash">ANIME<span>BREAK</span></div><div class="sub">RIFT ARENA // VERTICAL SLICE 0.2</div></div><div class="menuActions"><button id="play" class="menuBtn primary">Jogar — Ninjin vs Soku</button><button id="training" class="menuBtn">Treino livre</button><button id="about" class="menuBtn">Sobre a build</button></div><div class="build">PROTÓTIPO VISUAL • DUAS IDENTIDADES ORIGINAIS INSPIRADAS EM SHONEN</div></section>
<section id="versus" class="screen"><div class="versusCard"><div class="portrait left"><div class="silhouette" style="--hair:#f4c64c;--body1:#ef7b34;--body2:#252f48;--accent:#2e94d3"><div class="faceDisc"></div><div class="hair"></div><div class="bodyShape"></div><div class="beltShape"></div></div><div class="portraitName">NINJIN</div><div class="tag">ninja de curto alcance • clones • vento</div></div><div class="vsMark">VS</div><div class="portrait right"><div class="silhouette" style="--hair:#171d2d;--body1:#f0672f;--body2:#24498f;--accent:#f4c443"><div class="faceDisc"></div><div class="hair"></div><div class="bodyShape"></div><div class="beltShape"></div></div><div class="portraitName">SOKU</div><div class="tag">lutador de ki • pressão • rajadas</div></div><button id="go" class="menuBtn primary goBtn">Começar</button></div></section>
<div id="hud" class="hidden"><div class="hudTop"><div class="fighterHud"><div class="nameRow"><span>NINJIN</span><span id="pPct">100%</span></div><div class="hp"><i id="pHp"></i></div><div class="energy"><i id="pEn"></i></div><div class="ultBadge" id="pState">MODO BASE</div></div><div id="timer" class="timer">02:00</div><div class="fighterHud right"><div class="nameRow"><span>SOKU</span><span id="ePct">100%</span></div><div class="hp"><i id="eHp"></i></div><div class="energy"><i id="eEn"></i></div><div class="ultBadge" id="eState">MODO BASE</div></div></div><div id="reticle" class="lockReticle on"></div><div id="battleText" class="battleText"></div></div>
<div id="touchUI" class="hidden"><div id="joy" class="joystick"><div id="joyKnob" class="joyKnob"></div></div><div class="buttons"><button id="atk" class="act">拳<small>ATAQUE</small></button><button id="skill" class="act">✦<small>SKILL</small></button><button id="dash" class="act">➤<small>ESQUIVA</small></button><button id="guard" class="act">◆<small>DEFESA</small></button><button id="ult" class="act">ULT<small>FORMA</small></button><button id="lock" class="act">◎<small>ALVO</small></button></div><button id="pause" class="pause">Ⅱ</button></div>
<div id="cutin"><div class="cutInner"><div class="mangaLines"></div><div class="cutFace"><div class="cutEye"></div></div><div class="cutQuote">これで終わりだ！<small>AGORA ACABA.</small></div></div></div>
<div id="ko" class="ko hidden"><div class="koWord">K.O.</div></div>
<div id="modal" class="modal hidden"><div class="card"><h2 id="modalTitle">PAUSADO</h2><p id="modalText"></p><button id="resume" class="menuBtn primary">Continuar</button><button id="retry" class="menuBtn">Reiniciar luta</button><button id="backMenu" class="menuBtn">Menu</button></div></div>
<script>
(()=>{
'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id), lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,1.6),running=false,paused=false,last=0,timeLeft=120,lock=true,training=false;
let cam={x:0,y:0,zoom:1,shake:0,punch:0}; const particles=[]; const rings=[]; const slashes=[]; let audio=null,musicTimer=0;
const p={x:-180,y:0,z:0,vx:0,vy:0,hp:100,en:100,ult:0,face:1,hit:0,guard:0,dash:0,combo:0,comboT:0,form:0,formT:0,after:[],name:'NINJIN'};
const e={x:180,y:0,z:0,vx:0,vy:0,hp:100,en:100,ult:0,face:-1,hit:0,guard:0,dash:0,combo:0,comboT:0,form:0,formT:0,after:[],name:'SOKU',ai:0};
let joy={active:false,id:null,cx:0,cy:0,x:0,y:0}; let gamepadPrev=[];
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,1.6);c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function screen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
function reset(){Object.assign(p,{x:-180,y:0,z:0,vx:0,vy:0,hp:100,en:100,ult:0,face:1,hit:0,guard:0,dash:0,combo:0,comboT:0,form:0,formT:0,after:[]});Object.assign(e,{x:180,y:0,z:0,vx:0,vy:0,hp:100,en:100,ult:0,face:-1,hit:0,guard:0,dash:0,combo:0,comboT:0,form:0,formT:0,after:[],ai:0});timeLeft=120;cam.zoom=1;cam.shake=0;particles.length=rings.length=slashes.length=0;updateHud()}
function begin(){screen('menu');$('menu').classList.remove('active');$('versus').classList.remove('active');$('hud').classList.remove('hidden');$('touchUI').classList.remove('hidden');$('modal').classList.add('hidden');$('ko').classList.add('hidden');running=true;paused=false;reset();last=performance.now();ensureAudio();requestAnimationFrame(loop);say('戦え！  FIGHT!')}
$('play').onclick=()=>{training=false;screen('versus')};$('training').onclick=()=>{training=true;screen('versus')};$('go').onclick=begin;$('about').onclick=()=>showModal('VERTICAL SLICE 0.2','Primeira amostra visual do Anime Break. O foco desta build é câmera, impacto, HUD, cel-shading 2.5D e identidade dos dois primeiros lutadores. Ainda não representa modelos 3D finais.',true);
$('pause').onclick=()=>showModal('PAUSADO','A luta está congelada.',false);$('resume').onclick=()=>{paused=false;$('modal').classList.add('hidden');last=performance.now()};$('retry').onclick=()=>{paused=false;$('modal').classList.add('hidden');reset();last=performance.now()};$('backMenu').onclick=()=>{running=false;paused=false;$('hud').classList.add('hidden');$('touchUI').classList.add('hidden');$('modal').classList.add('hidden');screen('menu')};
function showModal(t,txt,about){paused=!about&&running;$('modalTitle').textContent=t;$('modalText').textContent=txt;$('resume').style.display=about?'none':'block';$('retry').style.display=about?'none':'block';$('modal').classList.remove('hidden');if(about){$('backMenu').textContent='Fechar';$('backMenu').onclick=()=>{$('modal').classList.add('hidden');$('backMenu').textContent='Menu';$('backMenu').onclick=()=>{running=false;$('hud').classList.add('hidden');$('touchUI').classList.add('hidden');$('modal').classList.add('hidden');screen('menu')}}}}
function ensureAudio(){if(audio)return;try{audio=new (AudioContext||webkitAudioContext)()}catch(_){} }
function tone(freq,dur,type='sine',gain=.05,pan=0){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain(),pn=audio.createStereoPanner?audio.createStereoPanner():null;o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);if(pn){pn.pan.value=pan;o.connect(g).connect(pn).connect(audio.destination)}else{o.connect(g).connect(audio.destination)}o.start();o.stop(audio.currentTime+dur)}
function sfx(kind,x=0){let pan=clamp(x/500,-.9,.9);if(kind==='hit'){tone(92,.09,'square',.11,pan);tone(180,.06,'sawtooth',.05,pan)}if(kind==='dash'){tone(260,.12,'sawtooth',.035,pan)}if(kind==='ki'){tone(540,.18,'triangle',.05,pan);tone(760,.13,'sine',.025,pan)}if(kind==='guard'){tone(880,.07,'square',.03,pan)}if(kind==='ult'){tone(110,.55,'sawtooth',.08,pan);setTimeout(()=>tone(440,.5,'triangle',.05,pan),120)}}
function music(dt){if(!audio||paused)return;musicTimer-=dt;if(musicTimer>0)return;const intensity=1-Math.min(p.hp,e.hp)/100;musicTimer=intensity>.65?.22:intensity>.3?.38:.62;const base=intensity>.65?98:intensity>.3?82:65;tone(base,.15,'triangle',.018,0);if(intensity>.3)tone(base*2,.08,'square',.008,0);if(intensity>.65)tone(base*3,.06,'sawtooth',.006,0)}
function say(t){const el=$('battleText');el.textContent=t;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
function impact(strength=1){cam.shake=Math.max(cam.shake,9*strength);cam.punch=Math.max(cam.punch,.09*strength);$('flash').style.opacity=String(.14*strength);setTimeout(()=>$('flash').style.opacity='0',60)}
function part(x,y,col,n=12,speed=160){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=speed*(.35+Math.random());particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.35,col,size:2+Math.random()*5})}}
function ring(x,y,col){rings.push({x,y,r:8,life:.35,col})}function slash(x,y,ang,col){slashes.push({x,y,ang,life:.2,col})}
function worldToScreen(x,y,z=0){const sx=W/2+(x-cam.x)*cam.zoom, sy=H*.64+(y-cam.y)*.36*cam.zoom-z*cam.zoom;return [sx,sy]}
function drawBackground(t){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#18294c');g.addColorStop(.45,'#6c4f6b');g.addColorStop(.72,'#d98a55');g.addColorStop(1,'#1a2431');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const sunX=W*.72,sunY=H*.22;ctx.beginPath();ctx.arc(sunX,sunY,Math.min(W,H)*.07,0,Math.PI*2);ctx.fillStyle='rgba(255,229,154,.78)';ctx.fill();for(let layer=0;layer<3;layer++){ctx.beginPath();let yy=H*(.4+layer*.07);ctx.moveTo(0,H);ctx.lineTo(0,yy);for(let x=0;x<=W+100;x+=80){let h=(45+Math.sin(x*.013+layer*2)*26+Math.sin(x*.032)*14)*(1-layer*.16);ctx.lineTo(x,yy-h)}ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=['#26344a','#1f2b3d','#182431'][layer];ctx.fill()}
ctx.save();ctx.translate(W/2,H*.64);ctx.scale(cam.zoom,cam.zoom*.36);ctx.translate(-cam.x,-cam.y);ctx.fillStyle='#3b4851';ctx.fillRect(-1000,-700,2000,1400);ctx.strokeStyle='rgba(255,255,255,.055)';ctx.lineWidth=2/cam.zoom;for(let x=-900;x<=900;x+=120){ctx.beginPath();ctx.moveTo(x,-700);ctx.lineTo(x,700);ctx.stroke()}for(let y=-700;y<=700;y+=120){ctx.beginPath();ctx.moveTo(-1000,y);ctx.lineTo(1000,y);ctx.stroke()}ctx.fillStyle='rgba(255,188,96,.07)';for(let i=-7;i<8;i++){ctx.beginPath();ctx.ellipse(i*150,(i%2)*120,80,28,0,0,Math.PI*2);ctx.fill()}ctx.restore();
for(let i=0;i<14;i++){let x=(i*173+60)%W,y=H*.55+((i*97)%140);ctx.fillStyle='rgba(10,18,24,.88)';ctx.fillRect(x-3,y-28,6,28);ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x-18,y-8);ctx.lineTo(x+2,y-16);ctx.lineTo(x+20,y-6);ctx.closePath();ctx.fill()}}
function drawShadow(f,col='rgba(0,0,0,.28)'){let [x,y]=worldToScreen(f.x,f.y,0);ctx.save();ctx.translate(x,y+5);ctx.scale(cam.zoom,cam.zoom*.38);ctx.beginPath();ctx.ellipse(0,0,32,15,0,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();ctx.restore()}
function drawFighter(f,who,t,ghost=false,alpha=1){let [x,y]=worldToScreen(f.x,f.y,f.z);const s=cam.zoom*(f.form?1.06:1);ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.scale(f.face*s,s);if(!ghost&&f.form){for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(0,-72,48+k*11,0,Math.PI*2);ctx.strokeStyle=who==='p'?`rgba(255,188,55,${.18-k*.04})`:`rgba(86,198,255,${.18-k*.04})`;ctx.lineWidth=5;ctx.stroke()}}
if(who==='p'){ctx.fillStyle='#f0bd42';for(let i=0;i<9;i++){ctx.beginPath();ctx.moveTo(-24+i*6,-112);ctx.lineTo(-35+i*8,-142-(i%3)*9);ctx.lineTo(-15+i*6,-121);ctx.closePath();ctx.fill()}ctx.fillStyle='#f2b17f';ctx.beginPath();ctx.arc(0,-103,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#202940';ctx.fillRect(-12,-111,25,4);ctx.fillStyle='#e66e2b';roundRect(-26,-82,52,70,12);ctx.fill();ctx.fillStyle='#28344d';roundRect(-21,-78,42,24,8);ctx.fill();ctx.fillStyle='#2c9bd5';ctx.fillRect(-26,-48,52,8);ctx.strokeStyle='#0d1320';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-19,-10);ctx.lineTo(-24,35);ctx.moveTo(19,-10);ctx.lineTo(24,35);ctx.stroke();ctx.strokeStyle='#1b2130';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(-20,-63);ctx.lineTo(-45,-30);ctx.moveTo(20,-63);ctx.lineTo(45,-30);ctx.stroke()}else{ctx.fillStyle='#141a29';for(let i=0;i<10;i++){ctx.beginPath();ctx.moveTo(-29+i*6,-111);ctx.lineTo(-43+i*9,-147-(i%2)*12);ctx.lineTo(-13+i*6,-122);ctx.closePath();ctx.fill()}ctx.fillStyle='#f0ad82';ctx.beginPath();ctx.arc(0,-101,23,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ee6630';roundRect(-28,-83,56,73,12);ctx.fill();ctx.fillStyle='#204a94';ctx.beginPath();ctx.moveTo(-25,-79);ctx.lineTo(0,-52);ctx.lineTo(25,-79);ctx.lineTo(20,-26);ctx.lineTo(-20,-26);ctx.closePath();ctx.fill();ctx.fillStyle='#f4ca48';ctx.fillRect(-27,-38,54,7);ctx.strokeStyle='#172443';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(-20,-65);ctx.lineTo(-46,-32);ctx.moveTo(20,-65);ctx.lineTo(46,-32);ctx.stroke();ctx.strokeStyle='#24365c';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-18,-9);ctx.lineTo(-22,36);ctx.moveTo(18,-9);ctx.lineTo(22,36);ctx.stroke()}
ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-10,-104);ctx.lineTo(-3,-103);ctx.moveTo(10,-104);ctx.lineTo(3,-103);ctx.stroke();ctx.restore()}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):(ctx.rect(x,y,w,h));}
function drawEffects(){for(const r of rings){let [x,y]=worldToScreen(r.x,r.y,0);ctx.beginPath();ctx.arc(x,y,r.r*cam.zoom,0,Math.PI*2);ctx.strokeStyle=r.col;ctx.lineWidth=4;ctx.globalAlpha=clamp(r.life*3,0,1);ctx.stroke()}ctx.globalAlpha=1;for(const s of slashes){let [x,y]=worldToScreen(s.x,s.y,0);ctx.save();ctx.translate(x,y);ctx.rotate(s.ang);ctx.globalAlpha=clamp(s.life*5,0,1);let g=ctx.createLinearGradient(-60,0,60,0);g.addColorStop(0,'transparent');g.addColorStop(.5,s.col);g.addColorStop(1,'transparent');ctx.strokeStyle=g;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-65,0);ctx.lineTo(65,0);ctx.stroke();ctx.restore()}for(const q of particles){let [x,y]=worldToScreen(q.x,q.y,0);ctx.globalAlpha=clamp(q.life*4,0,1);ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(x,y,q.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function draw(t){ctx.save();let sx=(Math.random()-.5)*cam.shake,sy=(Math.random()-.5)*cam.shake;ctx.translate(sx,sy);drawBackground(t);drawShadow(p);drawShadow(e);for(const a of p.after)drawFighter({x:a.x,y:a.y,z:0,face:a.face,form:p.form},'p',t,true,a.life*.25);for(const a of e.after)drawFighter({x:a.x,y:a.y,z:0,face:a.face,form:e.form},'e',t,true,a.life*.2);drawFighter(p,'p',t);drawFighter(e,'e',t);drawEffects();ctx.restore();cam.shake*=.82;cam.punch*=.82}
function attack(att,def,who){if(att.hit>0||att.dash>.04)return;att.hit=.18;att.combo=(att.comboT>0)?(att.combo%3)+1:1;att.comboT=.55;const range=74+att.combo*5,dist=Math.abs(att.x-def.x)+Math.abs(att.y-def.y)*.45;if(dist<range){let dmg=[4,5,8][att.combo-1]*(att.form?1.24:1);if(def.guard>0){dmg*=.18;sfx('guard',def.x);part(def.x,def.y,'#bde9ff',8,90)}else{def.hit=.22;def.vx=att.face*(85+att.combo*34);def.vy=(def.y-att.y)*.6;impact(att.combo===3?1.4:.85);sfx('hit',def.x);part((att.x+def.x)/2,(att.y+def.y)/2,who==='p'?'#ffd470':'#78e1ff',18,220);slash((att.x+def.x)/2,(att.y+def.y)/2,-.2*att.face,who==='p'?'#fff0ae':'#bdeaff');att.ult=clamp(att.ult+8,0,100);def.ult=clamp(def.ult+4,0,100)}def.hp=clamp(def.hp-dmg,0,100);if(att.combo===3)ring(def.x,def.y,'rgba(255,255,255,.7)');checkKO(att,def,who)}else{sfx('dash',att.x)}}
function skill(att,def,who){if(att.en<18||att.hit>0)return;att.en-=18;att.hit=.4;const dir=att.face,col=who==='p'?'#ffd463':'#62d8ff';sfx('ki',att.x);say(who==='p'?'影走り！  KAGE HASHIRI!':'気砲！  KI-HŌ!');let x=att.x,y=att.y,life=.55;const proj={x,y,vx:dir*(who==='p'?540:620),vy:0,life,owner:who,col};projectiles.push(proj);for(let i=0;i<16;i++)particles.push({x:att.x+dir*30,y:att.y+(Math.random()-.5)*20,vx:dir*(120+Math.random()*120),vy:(Math.random()-.5)*160,life:.35,col,size:2+Math.random()*4})}
const projectiles=[];
function updateProjectiles(dt){for(let i=projectiles.length-1;i>=0;i--){let q=projectiles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;let target=q.owner==='p'?e:p;if(Math.abs(q.x-target.x)<42&&Math.abs(q.y-target.y)<55&&q.life>0){let dmg=q.owner==='p'?8:9;if(target.guard>0)dmg*=.24;target.hp=clamp(target.hp-dmg,0,100);target.hit=.25;target.vx=q.vx*.18;impact(1.1);part(target.x,target.y,q.col,28,260);ring(target.x,target.y,q.col);sfx('ki',target.x);(q.owner==='p'?p:e).ult=clamp((q.owner==='p'?p:e).ult+12,0,100);checkKO(q.owner==='p'?p:e,target,q.owner);projectiles.splice(i,1);continue}if(q.life<=0||Math.abs(q.x)>850)projectiles.splice(i,1)} }
function drawProjectiles(){for(const q of projectiles){let [x,y]=worldToScreen(q.x,q.y,22);ctx.save();ctx.translate(x,y);let g=ctx.createRadialGradient(0,0,2,0,0,24);g.addColorStop(0,'#fff');g.addColorStop(.25,q.col);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.fill();ctx.strokeStyle=q.col;ctx.lineWidth=7;ctx.globalAlpha=.45;ctx.beginPath();ctx.moveTo(-70*(q.vx>0?1:-1),0);ctx.lineTo(0,0);ctx.stroke();ctx.restore()}}
const oldDraw=draw;draw=function(t){ctx.save();let sx=(Math.random()-.5)*cam.shake,sy=(Math.random()-.5)*cam.shake;ctx.translate(sx,sy);drawBackground(t);drawShadow(p);drawShadow(e);for(const a of p.after)drawFighter({x:a.x,y:a.y,z:0,face:a.face,form:p.form},'p',t,true,a.life*.25);for(const a of e.after)drawFighter({x:a.x,y:a.y,z:0,face:a.face,form:e.form},'e',t,true,a.life*.2);drawFighter(p,'p',t);drawFighter(e,'e',t);drawProjectiles();drawEffects();ctx.restore();cam.shake*=.82;cam.punch*=.82}
function dash(f,who){if(f.en<5||f.dash>0||f.hit>0)return;f.en-=5;f.dash=.2;f.vx=f.face*650;f.after.push({x:f.x,y:f.y,face:f.face,life:1});sfx('dash',f.x);cam.zoom=Math.max(cam.zoom,.97);if(who==='p')say('瞬歩！')}
function guard(f){f.guard=.26;sfx('guard',f.x)}
function transform(f,who){if(f.ult<100||f.form)return;f.ult=0;f.form=1;f.formT=10;sfx('ult',f.x);impact(1.6);for(let i=0;i<50;i++)part(f.x,f.y,who==='p'?'#ffd35b':'#67dcff',1,320);say(who==='p'?'限界突破！  LIMIT BREAK!':'解放！  KAIHŌ!');$('cutin').classList.add('show');setTimeout(()=>$('cutin').classList.remove('show'),760)}
function checkKO(att,def,who){if(training){if(def.hp<=0)def.hp=100;return}if(def.hp<=0){running=false;paused=true;impact(2);$('ko').classList.remove('hidden');$('cutin').classList.add('show');setTimeout(()=>$('cutin').classList.remove('show'),700);setTimeout(()=>{$('ko').classList.add('hidden');showModal(who==='p'?'VITÓRIA — NINJIN':'DERROTA — SOKU','A vertical slice registrou câmera de impacto, efeitos, HUD, energia e transformação. Reinicie para testar novamente.',false)},1000)}}
function ai(dt){if(training)return;e.ai-=dt;const dx=p.x-e.x,dy=p.y-e.y,dist=Math.abs(dx)+Math.abs(dy)*.4;e.face=dx>0?1:-1;if(e.hit<=0&&e.dash<=0){if(Math.abs(dx)>115){e.vx+=Math.sign(dx)*210*dt;e.vy+=Math.sign(dy)*110*dt}else{e.vx*=.82;e.vy*=.82}if(e.ai<=0){e.ai=.32+Math.random()*.5;let r=Math.random();if(dist<92&&r<.52)attack(e,p,'e');else if(r<.69&&e.en>20)skill(e,p,'e');else if(r<.84)dash(e,'e');else guard(e);if(e.ult>=100&&Math.random()<.4)transform(e,'e')}}}
function input(dt){let ax=joy.x,ay=joy.y;const gp=navigator.getGamepads?.()[0];if(gp){ax=Math.abs(gp.axes[0])>.14?gp.axes[0]:ax;ay=Math.abs(gp.axes[1])>.14?gp.axes[1]:ay;const b=gp.buttons;function edge(i,fn){if(b[i]?.pressed&&!gamepadPrev[i])fn()}edge(0,()=>attack(p,e,'p'));edge(1,()=>dash(p,'p'));edge(2,()=>skill(p,e,'p'));edge(3,()=>guard(p));edge(4,()=>{lock=!lock;$('reticle').classList.toggle('on',lock)});edge(5,()=>transform(p,'p'));gamepadPrev=b.map(x=>x.pressed)}if(p.hit<=0&&p.dash<=0){p.vx+=ax*380*dt;p.vy+=ay*280*dt;if(Math.abs(ax)>.12)p.face=ax>0?1:-1}}
function physics(f,dt){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=Math.pow(.006,dt);f.vy*=Math.pow(.008,dt);f.x=clamp(f.x,-690,690);f.y=clamp(f.y,-420,420);f.hit=Math.max(0,f.hit-dt);f.guard=Math.max(0,f.guard-dt);f.dash=Math.max(0,f.dash-dt);f.comboT=Math.max(0,f.comboT-dt);if(f.comboT<=0)f.combo=0;f.en=clamp(f.en+11*dt,0,100);if(f.form){f.formT-=dt;if(f.formT<=0){f.form=0;f.formT=0}}for(let i=f.after.length-1;i>=0;i--){f.after[i].life-=dt*4;if(f.after[i].life<=0)f.after.splice(i,1)}}
function updateEffects(dt){for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.93;q.vy*=.93;q.life-=dt;if(q.life<=0)particles.splice(i,1)}for(let i=rings.length-1;i>=0;i--){rings[i].r+=220*dt;rings[i].life-=dt;if(rings[i].life<=0)rings.splice(i,1)}for(let i=slashes.length-1;i>=0;i--){slashes[i].life-=dt;if(slashes[i].life<=0)slashes.splice(i,1)}}
function updateHud(){$('pHp').style.width=p.hp+'%';$('eHp').style.width=e.hp+'%';$('pEn').style.width=p.en+'%';$('eEn').style.width=e.en+'%';$('pPct').textContent=Math.ceil(p.hp)+'%';$('ePct').textContent=Math.ceil(e.hp)+'%';$('pState').textContent=p.form?'FORMA DESPERTA '+Math.ceil(p.formT)+'s':p.ult>=100?'ULT PRONTA':'ULT '+Math.floor(p.ult)+'%';$('eState').textContent=e.form?'FORMA DESPERTA '+Math.ceil(e.formT)+'s':e.ult>=100?'ULT PRONTA':'ULT '+Math.floor(e.ult)+'%';let m=Math.max(0,Math.floor(timeLeft/60)),s=Math.max(0,Math.floor(timeLeft%60));$('timer').textContent=training?'∞':String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function step(dt){input(dt);ai(dt);physics(p,dt);physics(e,dt);updateProjectiles(dt);updateEffects(dt);if(lock){p.face=e.x>p.x?1:-1;let cx=(p.x+e.x)/2,cy=(p.y+e.y)/2;cam.x=lerp(cam.x,cx,.08);cam.y=lerp(cam.y,cy,.08);let d=Math.abs(p.x-e.x);let target=clamp(1.08-d/1600,.76,1.04);cam.zoom=lerp(cam.zoom+cam.punch,target,.06)}else{cam.x=lerp(cam.x,p.x,.06);cam.y=lerp(cam.y,p.y,.06);cam.zoom=lerp(cam.zoom,1,.05)}if(!training){timeLeft-=dt;if(timeLeft<=0){running=false;paused=true;showModal(p.hp>=e.hp?'TEMPO — NINJIN À FRENTE':'TEMPO — SOKU À FRENTE','Fim do tempo da demonstração.',false)}}music(dt);updateHud()}
function loop(ts){if(!running)return;let dt=Math.min(.033,(ts-last)/1000||.016);last=ts;if(!paused)step(dt);draw(ts*.001);requestAnimationFrame(loop)}
function bindBtn(id,fn){$(id).addEventListener('pointerdown',ev=>{ev.preventDefault();ensureAudio();fn()})}bindBtn('atk',()=>attack(p,e,'p'));bindBtn('skill',()=>skill(p,e,'p'));bindBtn('dash',()=>dash(p,'p'));bindBtn('guard',()=>guard(p));bindBtn('ult',()=>transform(p,'p'));bindBtn('lock',()=>{lock=!lock;$('reticle').classList.toggle('on',lock);say(lock?'ALVO TRAVADO':'CÂMERA LIVRE')});
const joyEl=$('joy'),knob=$('joyKnob');joyEl.addEventListener('pointerdown',ev=>{joy.active=true;joy.id=ev.pointerId;joyEl.setPointerCapture(ev.pointerId);let r=joyEl.getBoundingClientRect();joy.cx=r.left+r.width/2;joy.cy=r.top+r.height/2;moveJoy(ev)});joyEl.addEventListener('pointermove',ev=>{if(joy.active&&ev.pointerId===joy.id)moveJoy(ev)});function endJoy(ev){if(ev.pointerId!==joy.id)return;joy.active=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}joyEl.addEventListener('pointerup',endJoy);joyEl.addEventListener('pointercancel',endJoy);function moveJoy(ev){let dx=ev.clientX-joy.cx,dy=ev.clientY-joy.cy,r=48,d=Math.hypot(dx,dy)||1,k=Math.min(1,r/d);dx*=k;dy*=k;joy.x=dx/r;joy.y=dy/r;knob.style.transform=`translate(${dx}px,${dy}px)`}
addEventListener('keydown',ev=>{if(!running)return;if(ev.key==='j')attack(p,e,'p');if(ev.key==='k')skill(p,e,'p');if(ev.key==='l')dash(p,'p');if(ev.key==='i')guard(p);if(ev.key==='u')transform(p,'p')});
function idle(ts){if(running)return;ctx.clearRect(0,0,W,H);drawBackground(ts*.001);let demoP={...p,x:-160,y:20,face:1,form:0},demoE={...e,x:170,y:-20,face:-1,form:0};drawShadow(demoP);drawShadow(demoE);drawFighter(demoP,'p',ts*.001);drawFighter(demoE,'e',ts*.001);requestAnimationFrame(idle)}requestAnimationFrame(idle);
})();
